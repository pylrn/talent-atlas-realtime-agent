name: Deploy journey to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/free-demo-hosting
    paths:
      - api/static/project-story/**
      - .github/workflows/deploy-journey.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static story
        env:
          DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}
        run: |
          mkdir -p _site
          cp -R api/static/project-story/. _site/
          sed -i 's#/static/project-story/#./#g' _site/index.html _site/story.css
          if [ -n "$DEMO_BASE_URL" ]; then
            sed -i "s#href=\"/talent\"#href=\"${DEMO_BASE_URL%/}/talent\"#g" _site/index.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

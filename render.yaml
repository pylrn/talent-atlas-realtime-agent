services:
  - type: web
    name: talent-atlas
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/render/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MIN
        value: "1"
      - key: DB_POOL_MAX
        value: "3"
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: EMBEDDING_DIMENSIONS
        value: "384"
      - key: LOCAL_EMBEDDING_BACKEND
        value: fastembed
      - key: LOCAL_RERANKER_BACKEND
        value: fastembed
      - key: EVICT_LOCAL_RERANKER_AFTER_USE
        value: "true"
      - key: RERANKER_MODEL
        value: local-fast
      - key: HNSW_EF_SEARCH
        value: "40"
      - key: LLM_PROVIDER
        value: deepseek
      - key: LLM_MODEL
        value: deepseek-chat
      - key: FAST_LLM_PROVIDER
        value: deepseek
      - key: FAST_LLM_MODEL
        value: deepseek-chat
      - key: QUALITY_LLM_PROVIDER
        value: deepseek
      - key: QUALITY_LLM_MODEL
        value: deepseek-chat
      - key: INSIGHTS_LLM_PROVIDER
        value: groq
      - key: INSIGHTS_LLM_MODEL
        value: llama-3.1-8b-instant
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: USE_PERSONALIZATION
        value: "false"
      - key: LANGFUSE_ENABLED
        value: "false"
      - key: LANGFUSE_ENVIRONMENT
        value: production
      - key: LANGFUSE_TRACE_CONTENT_MODE
        value: prod_redacted

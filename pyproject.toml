[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "api*"]

[project]
name = "hybrid-search"
version = "0.1.0"
description = "Two-stage hybrid search: structured SQL filtering + pgvector semantic search for hiring platforms"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pydantic-ai-slim[groq]>=1.106.0,<2.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "sentence-transformers>=5.0.0",
    "tiktoken>=0.8.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "redis>=5.2.0",
    "langfuse>=4.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-asyncpg>=0.46b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]
extractors = [
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
